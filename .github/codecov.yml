# ref: https://docs.codecov.com/docs/codecovyml-reference
coverage:
  # Hold ourselves to a high bar
  range: 85..100
  round: down
  precision: 1
  status:
    # ref: https://docs.codecov.com/docs/commit-status
    project:
      default:
        # Avoid false negatives
        threshold: 1%

# Test files, mock binaries, test helper binaries, and examples aren't important
# for coverage. `bazel coverage` (the sole coverage source) only instruments
# first-party library / binary / test targets, and examples have no Bazel targets,
# so they don't appear in the report; the `**/examples/**` ignore is kept as a
# guard in case example targets are ever added. See docs/plans/archive/bazel-migration.md
# "Coverage under Bazel".
ignore:
  - "tests"
  - "**/bin/mock_*.rs"
  - "**/bin/test_*.rs"
  - "**/examples/**"

# Make comments less noisy
comment:
  layout: "files"
  require_changes: true

# Flag carryforward is OFF (ref: https://docs.codecov.com/docs/carryforward-flags).
# `bazel coverage` (bazel-coverage.yml) is the sole coverage uploader and it
# uploads every canonical `<pkg>` flag on every run, so no live flag ever needs
# backfilling. Carryforward would also resurrect retired flags (old flag
# namings, renamed crates) whose last-known reports reference source layouts
# that no longer exist; those phantom files are merged into the report as
# missed lines and corrupt the project totals the `codecov/project` gate
# compares. The cost of OFF: when a coverage run is cancelled or fails, the
# per-service badges show "unknown" until the next successful run instead of
# holding their last-known value.
flag_management:
  default_rules:
    carryforward: false
